version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR for the routine churn, individual PRs for majors worth reading.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TS 7 typechecks and builds fine here, but typescript-eslint refuses to
      # load against it, which takes linting down entirely.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-config-next bundles eslint-plugin-react, which still calls the
      # context.getFilename() API that ESLint 10 removed.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Must track the Node major pinned in .nvmrc, not the newest release
      # line — bump this deliberately when .nvmrc moves.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
